<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./theme.css" />
<script>
  (function () {
    var p = "plinth", t = null, l = null;
    try { t = localStorage.getItem(p + "-theme"); l = localStorage.getItem(p + "-lang"); } catch (e) {}
    document.documentElement.dataset.theme =
      t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.lang =
      l || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");

    // This markup is written in English. A German visitor would otherwise read
    // one painted frame of English before the translator runs, which is the
    // flicker. Hide until it has run, and only for the languages that need
    // swapping, so an English visitor waits for nothing. The timeout is the
    // safety net: if the module never loads, the page appears in English
    // rather than staying blank forever.
    if (document.documentElement.lang !== "en") {
      document.documentElement.dataset.i18nPending = "1";
      setTimeout(function () {
        delete document.documentElement.dataset.i18nPending;
      }, 1200);
    }
  })();
</script>
</head>

<main id="top">

  <!-- Whoever is connected ------------------------------------------------
       Deliberately not "Arsalan's profile". The page shows the address that
       connected and nothing else, because hardcoding one owner would tie a
       name to every holding it ever has. -->
  <section class="hero">
    <div class="col-head glass reveal">
      <div class="col-avatar" id="p-avatar" aria-hidden="true"></div>
      <div class="col-id">
        <h1 data-i18n="prof.title">Your wallet</h1>
        <p class="col-by">
          <a id="p-address" href="#" target="_blank" rel="noopener">—</a>
          <span class="sep">·</span>
          <!-- Every chain this page reads, from the registry. It said "Polygon
               Amoy" while the page was already reading two chains, so a wallet
               holding dogs was told it was looking at a testnet. -->
          <span id="p-chain-names">—</span>
        </p>
        <p class="col-desc" data-i18n="prof.sub"></p>
      </div>
    </div>

    <!-- Four numbers, every one of them an `eth_call`. Nothing here comes
         from an indexer, because this project does not have one. -->
    <div class="stats glass reveal">
      <div><span class="k" data-i18n="prof.owned"></span><span class="v" id="p-owned">—</span></div>
      <div><span class="k" data-i18n="prof.listed"></span><span class="v" id="p-listed">—</span></div>
      <div><span class="k" data-i18n="prof.across"></span><span class="v" id="p-across">—</span></div>
      <div><span class="k" data-i18n="prof.chains"></span><span class="v accent" id="p-chains">—</span></div>
    </div>
  </section>

  <section class="band reveal">
    <h2 data-i18n="prof.items">Your tokens</h2>

    <p class="empty" id="p-connect" hidden>
      <span data-i18n="prof.connect"></span>
      <button type="button" class="pill" id="p-connect-btn" data-i18n="prof.connectCta">Connect</button>
    </p>

    <p class="empty" id="p-nowallet" hidden data-i18n="prof.noWallet"></p>

    <p class="empty" id="p-empty" hidden>
      <span data-i18n="prof.empty"></span>
      <a href="./index.html#mine" data-i18n="prof.emptyCta">Mint one on the market</a>
    </p>

    <!-- Balance and what is owed, one row per chain. Never a total: POL on a
         testnet and POL on mainnet share a ticker and nothing else. -->
    <div class="wallets" id="p-wallets" hidden></div>

    <div class="grid" id="p-grid"></div>

    <p class="col-bar" id="p-withdraw-row" hidden>
      <span class="scene-note" id="p-withdraw-note">—</span>
      <button type="button" class="pill" id="p-withdraw" data-i18n="prof.withdraw">Withdraw</button>
    </p>

    <p class="scene-note" data-i18n="prof.privacy"></p>
  </section>

</main>
