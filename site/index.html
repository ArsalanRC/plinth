<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="meta.title">plinth</title>
<meta name="description" content="An NFT marketplace on Polygon. Mint, list and buy, with the art generated on chain and the front end talking to the chain with no library at all." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./theme.css" />
<script>
  // Before first paint: no theme flash, no language flash. Inline on purpose.
  // An external file here would be a round trip during which the page renders
  // in the wrong theme, which is exactly the flash this prevents.
  (function () {
    var p = "plinth", t = null, l = null;
    try { t = localStorage.getItem(p + "-theme"); l = localStorage.getItem(p + "-lang"); } catch (e) {}
    document.documentElement.dataset.theme =
      t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var browserIsGerman = (navigator.language || "en").toLowerCase().startsWith("de");
    document.documentElement.lang = l || (browserIsGerman ? "de" : "en");

    // This markup is written in English. A German visitor would otherwise read
    // one painted frame of English before the translator runs, which is the
    // flicker. Hide until it has run, and only for the languages that need
    // swapping, so an English visitor waits for nothing. The timeout is the
    // safety net: if the module never loads, the page appears in English
    // rather than staying blank forever.
    if (document.documentElement.lang !== "en") {
      document.documentElement.dataset.i18nPending = "1";
      setTimeout(function () {
        delete document.documentElement.dataset.i18nPending;
      }, 1200);
    }
  })();
</script>
</head>
<body>

<!-- The landscape. Generated here rather than downloaded, so there is no
     licence to honour and no third party who can take it away. Four ridges,
     lightest at the back, which is how distance actually looks. No orbs and
     nothing that drifts: the only motion is parallax under a real scroll
     position. -->
<div class="backdrop" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--sky-top)" />
        <stop offset="100%" stop-color="var(--sky-bottom)" />
      </linearGradient>
    </defs>

    <rect width="1440" height="900" fill="url(#sky)" />

    <path class="ridge" data-depth="0.06" fill="var(--ridge-4)"
      d="M0 520 L120 470 L210 505 L320 440 L430 495 L540 450 L660 500 L780 455 L900 505 L1020 460 L1140 500 L1260 465 L1360 500 L1440 470 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.12" fill="var(--ridge-3)"
      d="M0 600 L110 555 L230 595 L340 540 L470 590 L590 545 L700 595 L830 550 L950 600 L1070 555 L1200 600 L1320 560 L1440 600 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.2" fill="var(--ridge-2)"
      d="M0 690 L130 650 L250 690 L380 640 L500 690 L620 645 L750 695 L870 650 L990 695 L1110 655 L1240 700 L1360 660 L1440 690 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.3" fill="var(--ridge-1)"
      d="M0 780 L140 745 L270 785 L400 740 L520 790 L650 748 L780 795 L900 750 L1030 795 L1150 755 L1280 800 L1400 760 L1440 780 L1440 900 L0 900 Z" />
  </svg>
</div>

<!-- Grain, so a wide gradient never bands. -->
<svg class="grain" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.32" />
</svg>

<header class="topbar">
  <a class="wordmark" href="#top">plinth</a>
  <nav class="topnav">
    <a href="./start.html" data-i18n="nav.start">Start here</a>
    <a href="./index.html" class="is-here" data-i18n="nav.market">Market</a>
    <a href="./collection.html" data-i18n="nav.collection">Collection</a>
    <a href="./profile.html" data-i18n="nav.profile">Profile</a>
    <a href="https://github.com/ArsalanRC/plinth" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg><span data-i18n="nav.source">Source</span>
    </a>
    <a href="https://www.linkedin.com/in/muhammad-arsalan-khadim-b87550259/" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zm1.78 13.02H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg><span data-i18n="nav.linkedin">LinkedIn</span>
    </a>
    <button type="button" class="pill" id="connect" data-i18n="nav.connect">Connect</button>
    <button type="button" class="pill" id="signout" data-i18n="nav.signout" hidden>Sign out</button>
    <button type="button" class="pill" id="lang-btn" data-i18n="nav.lang">Deutsch</button>
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.4 12h2.4M19.2 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z"/></svg>
    </button>
  </nav>
</header>

<main id="top">

  <section class="hero">
    <p class="megaword" aria-hidden="true"><span>PLINTH</span></p>

    <p class="kicker" data-i18n="hero.kicker"></p>
    <h1 class="hero-title" data-i18n-html="hero.title"></h1>
    <p class="lede" data-i18n="hero.lede"></p>

    <div class="hero-actions">
      <button type="button" class="btn btn-primary" id="connect-2" data-i18n="hero.connect"></button>
      <a class="btn" href="#market" data-i18n="hero.browse"></a>
    </div>

    <!-- The wallet. Real when connected, invented in demo mode, and the badge
         is the difference. Nothing here is ever ambiguous about which. -->
    <div class="wallet glass reveal" id="wallet">
      <div class="cell">
        <span class="k" data-i18n="wallet.account"></span>
        <span class="v" id="w-address">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="wallet.balance"></span>
        <span class="v" id="w-balance">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="wallet.owned"></span>
        <span class="v" id="w-owned">—</span>
      </div>
      <div class="cell">
        <span class="k" data-i18n="wallet.proceeds"></span>
        <span class="v accent" id="w-proceeds">—</span>
      </div>
      <div class="cell actions">
        <span class="badge-demo" id="w-demo" hidden data-i18n="wallet.demo"></span>
        <button type="button" class="btn" id="withdraw" data-i18n="wallet.withdraw"></button>
      </div>
    </div>

    <!-- Test POL. A convenience and not a promise: nobody can create Amoy POL,
         so this only ever hands on what its owner claimed from a public
         faucet. The panel says that, says how full it is, and says what to do
         when it is empty. State is carried by the border, a tint and the chip,
         never by a bar down one edge. -->
    <div class="faucet glass reveal" id="faucet">
      <div class="scene-head">
        <h3 data-i18n="faucet.title"></h3>
        <span class="scene-note" id="faucet-chip">—</span>
      </div>

      <p class="body" id="faucet-body"></p>

      <div class="hero-actions">
        <button type="button" class="btn btn-primary" id="drip" data-i18n="faucet.get"></button>
        <a class="btn" id="faucet-public" target="_blank" rel="noopener" data-i18n="faucet.public"></a>
      </div>

      <p class="caption" id="faucet-note"></p>
    </div>

    <p class="status" id="status"></p>
  </section>

  <!-- The market ------------------------------------------------------- -->
  <section class="band reveal" id="market">
    <p class="eyebrow" data-i18n="market.eyebrow"></p>
    <h2 data-i18n="market.title"></h2>
    <p class="body" data-i18n="market.body"></p>

    <div class="grid" id="market-grid"></div>
    <p class="empty" id="market-empty" hidden data-i18n="market.empty"></p>
  </section>

  <!-- Mint and your items ---------------------------------------------- -->
  <section class="band reveal" id="mine">
    <p class="eyebrow" data-i18n="mine.eyebrow"></p>
    <h2 data-i18n="mine.title"></h2>
    <p class="body" data-i18n="mine.body"></p>

    <div class="hero-actions">
      <button type="button" class="btn btn-primary" id="mint" data-i18n="mine.mint"></button>
      <span class="scene-note" id="supply">—</span>
    </div>

    <!-- One button per collection, because there is more than one now and they
         are on different chains. Built from COLLECTIONS so a third needs no
         markup. The button above stays: it mints the collection this page
         trades, which is the one the grid below shows. -->
    <div class="mint-others" id="mint-others"></div>
    <p class="scene-note" id="mint-others-note" hidden></p>

    <div class="grid" id="mine-grid"></div>
    <p class="empty" id="mine-empty" hidden data-i18n="mine.empty"></p>
  </section>

  <!-- How it settles ---------------------------------------------------- -->
  <section class="band reveal">
    <p class="eyebrow" data-i18n="split.eyebrow"></p>
    <h2 data-i18n="split.title"></h2>
    <p class="body" data-i18n="split.body"></p>

    <div class="scene glass">
      <div class="scene-head">
        <h3 data-i18n="split.sceneTitle"></h3>
        <span class="scene-note" id="split-note">—</span>
      </div>

      <div class="split-bar" aria-hidden="true">
        <span class="s-seller" id="bar-seller"></span>
        <span class="s-creator" id="bar-creator"></span>
        <span class="s-market" id="bar-market"></span>
      </div>

      <div class="split-legend">
        <div class="l-seller">
          <span class="k" data-i18n="split.seller"></span>
          <span class="v" id="v-seller">0</span>
        </div>
        <div class="l-creator">
          <span class="k" data-i18n="split.creator"></span>
          <span class="v" id="v-creator">0</span>
        </div>
        <div class="l-market">
          <span class="k" data-i18n="split.market"></span>
          <span class="v" id="v-market">0</span>
        </div>
      </div>

      <p class="caption" data-i18n="split.caption"></p>
    </div>
  </section>

  <!-- Why nobody is paid during a sale ---------------------------------- -->
  <section class="band reveal">
    <p class="eyebrow" data-i18n="pay.eyebrow"></p>
    <h2 data-i18n="pay.title"></h2>
    <p class="body" data-i18n="pay.body"></p>

    <div class="scene glass">
      <div class="scene-head">
        <h3 data-i18n="pay.sceneTitle"></h3>
        <button type="button" class="pill" id="pay-replay" data-i18n="common.replay"></button>
      </div>

      <div class="lanes">
        <div class="lane" id="lane-push">
          <h3 data-i18n="pay.pushTitle"></h3>
          <p class="lane-sub" data-i18n="pay.pushSub"></p>
          <ol class="steps" id="steps-push"></ol>
          <p class="verdict" id="verdict-push"></p>
        </div>
        <div class="lane" id="lane-pull">
          <h3 data-i18n="pay.pullTitle"></h3>
          <p class="lane-sub" data-i18n="pay.pullSub"></p>
          <ol class="steps" id="steps-pull"></ol>
          <p class="verdict" id="verdict-pull"></p>
        </div>
      </div>

      <p class="caption" data-i18n="pay.caption"></p>
    </div>
  </section>

  <!-- Status ------------------------------------------------------------ -->
  <section class="band reveal">
    <p class="eyebrow" data-i18n="status.eyebrow"></p>
    <h2 data-i18n="status.title"></h2>
    <ul class="ledger">
      <li class="is-done"><span data-i18n="status.p1"></span><em data-i18n="status.done"></em></li>
      <li class="is-done"><span data-i18n="status.p2"></span><em data-i18n="status.done"></em></li>
      <li class="is-done"><span data-i18n="status.p3"></span><em data-i18n="status.done"></em></li>
      <li id="status-deploy" class="is-done"><span data-i18n="status.p4"></span><em data-i18n="status.done"></em></li>
      <li><span data-i18n="status.p5"></span><em data-i18n="status.next"></em></li>
    </ul>
    <p class="caption" data-i18n="status.caption"></p>
  </section>

</main>

</body>
</html>
