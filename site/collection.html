<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="col.metaTitle">Plinth Cats · the collection</title>
<meta name="description" content="500 cats drawn on chain in seven weighted layers. Browse by trait, see what is rare, and open any one of them." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./theme.css" />
<script>
  (function () {
    var p = "plinth", t = null, l = null;
    try { t = localStorage.getItem(p + "-theme"); l = localStorage.getItem(p + "-lang"); } catch (e) {}
    document.documentElement.dataset.theme =
      t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.lang =
      l || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");

    // This markup is written in English. A German visitor would otherwise read
    // one painted frame of English before the translator runs, which is the
    // flicker. Hide until it has run, and only for the languages that need
    // swapping, so an English visitor waits for nothing. The timeout is the
    // safety net: if the module never loads, the page appears in English
    // rather than staying blank forever.
    if (document.documentElement.lang !== "en") {
      document.documentElement.dataset.i18nPending = "1";
      setTimeout(function () {
        delete document.documentElement.dataset.i18nPending;
      }, 1200);
    }
  })();
</script>
</head>
<body>

      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--sky-top)" />
        <stop offset="100%" stop-color="var(--sky-bottom)" />
      </linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#sky)" />
    <path class="ridge" data-depth="0.06" fill="var(--ridge-4)"
      d="M0 520 L120 470 L210 505 L320 440 L430 495 L540 450 L660 500 L780 455 L900 505 L1020 460 L1140 500 L1260 465 L1360 500 L1440 470 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.12" fill="var(--ridge-3)"
      d="M0 600 L110 555 L230 595 L340 540 L470 590 L590 545 L700 595 L830 550 L950 600 L1070 555 L1200 600 L1320 560 L1440 600 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.2" fill="var(--ridge-2)"
      d="M0 690 L130 650 L250 690 L380 640 L500 690 L620 645 L750 695 L870 650 L990 695 L1110 655 L1240 700 L1360 660 L1440 690 L1440 900 L0 900 Z" />
    <path class="ridge" data-depth="0.3" fill="var(--ridge-1)"
      d="M0 780 L140 745 L270 785 L400 740 L520 790 L650 748 L780 795 L900 750 L1030 795 L1150 755 L1280 800 L1400 760 L1440 780 L1440 900 L0 900 Z" />
  </svg>
</div>

<svg class="grain" aria-hidden="true">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" /><feColorMatrix type="saturate" values="0" /></filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.32" />
</svg>

<header class="topbar">
  <a class="wordmark" href="./index.html">plinth</a>
  <nav class="topnav">
    <a href="./start.html" data-i18n="nav.start">Start here</a>
    <a href="./index.html" data-i18n="nav.market">Market</a>
    <a href="./collection.html" class="is-here" data-i18n="nav.collection">Collection</a>
    <a href="./profile.html" data-i18n="nav.profile">Profile</a>
    <a href="https://github.com/ArsalanRC/plinth" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg><span data-i18n="nav.source">Source</span>
    </a>
    <a href="https://www.linkedin.com/in/muhammad-arsalan-khadim-b87550259/" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zm1.78 13.02H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg><span data-i18n="nav.linkedin">LinkedIn</span>

    <button type="button" class="pill" id="signout" data-i18n="nav.signout" hidden>Sign out</button>
    <button type="button" class="pill" id="lang-btn" data-i18n="nav.lang">Deutsch</button>

    </button>
  </nav>
</header>

<main id="top">

  <!-- Collection identity ------------------------------------------------ -->
  <section class="hero">
    <div class="col-head glass reveal">
      <div class="col-avatar" id="col-avatar" aria-hidden="true"></div>
      <div class="col-id">
        <h1 id="col-title">Plinth Cats</h1>
        <p class="col-by">
          <span data-i18n="col.by">Created by</span>
          <a id="col-creator" href="#" target="_blank" rel="noopener">—</a>
          <span class="sep">·</span>
          <!-- Which chain, and whether its coins are real. Never omitted: a
               floor of 0.5 means different things on the two. -->
          <span class="chain-badge" id="col-chain">Amoy</span>
          <span class="sep">·</span>
          <span>ERC-721</span>
        </p>
        <p class="col-desc" id="col-desc"></p>
        <p class="col-pending" id="col-pending" hidden data-i18n="col.pending"></p>

        <!-- Both collections, always visible, so neither is reachable only by
             knowing the query string. Built by the script from COLLECTIONS so
             a third one appears here without touching this file. -->
        <nav class="col-switch" id="col-switch" aria-label="Collections"></nav>

        <!-- Mint whichever collection this page is showing. Hidden until the
             collection is actually deployed, because a button that cannot work
             is worse than no button. -->
        <p class="col-mint" id="col-mint" hidden>
          <button type="button" class="btn btn-primary" id="mint-here" data-i18n="col.mint">Mint one</button>
          <span class="scene-note" id="mint-note" hidden></span>
        </p>
      </div>
    </div>

    <!-- Every figure here is read from the chain or computed from the
         contract. A stat that cannot be computed is left out rather than
         invented, which is why there is no volume or floor history. -->
    <div class="stats glass reveal">
      <div><span class="k" data-i18n="col.items"></span><span class="v" id="s-items">—</span></div>
      <div><span class="k" data-i18n="col.supply"></span><span class="v" id="s-supply">—</span></div>
      <div><span class="k" data-i18n="col.owners"></span><span class="v" id="s-owners">—</span></div>
      <div><span class="k" data-i18n="col.listed"></span><span class="v" id="s-listed">—</span></div>
      <div><span class="k" data-i18n="col.floor"></span><span class="v accent" id="s-floor">—</span></div>
    </div>
  </section>

  <!-- Filters and grid ---------------------------------------------------- -->
  <section class="band reveal">
    <div class="col-layout">

      <aside class="filters glass" id="filters">
        <div class="filters-head">
          <h2 data-i18n="col.traits">Traits</h2>
          <button type="button" class="pill" id="clear" data-i18n="col.clear">Clear</button>
        </div>
        <div id="filter-groups"></div>
      </aside>

      <div class="col-main">
        <div class="col-bar">
          <span class="scene-note" id="showing">—</span>
          <label class="sort">
            <span data-i18n="col.sort">Sort</span>
            <select id="sort" class="price-input">
              <option value="id" data-i18n="col.sortId">Token id</option>
              <option value="rare" data-i18n="col.sortRare">Rarest first</option>
              <option value="price" data-i18n="col.sortPrice">Price</option>
            </select>
          </label>
        </div>

        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden data-i18n="col.none"></p>
      </div>

    </div>
  </section>

</main>

<!-- One token, opened from the grid. A dialog rather than a third page: the
     URL still carries the id so it can be shared and reloaded, and going back
     returns you to the grid where you were rather than to the top of it. -->
<dialog class="token-dialog glass" id="token">
  <button type="button" class="token-close" id="token-close" aria-label="Close">&times;</button>
  <div class="token-body">
    <div class="token-art" id="t-art"></div>
    <div class="token-meta">
      <!-- Filled from the collection in the URL. It carried a fixed "Plinth
           Cats" through the whole two-collection change. -->
      <p class="eyebrow" id="t-collection"></p>
      <h2 id="t-name">—</h2>
      <p class="t-owner"><span data-i18n="tok.owner">Owned by</span> <span id="t-owner">—</span></p>

      <div class="t-price glass">
        <span class="k" data-i18n="tok.price">Price</span>
        <span class="v" id="t-price">—</span>
        <button type="button" class="btn btn-primary" id="t-action" hidden></button>
      </div>

      <h3 data-i18n="tok.traits">Traits</h3>
      <div class="t-traits" id="t-traits"></div>

      <h3 data-i18n="tok.details">Details</h3>
      <dl class="t-details" id="t-details"></dl>
    </div>
  </div>
</dialog>

</html>
